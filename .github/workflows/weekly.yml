name: Weekly Top 5

on:
  schedule:
    - cron: '0 8 * * 5'  # Friday at 08:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-top5:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run weekly scraper
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/fetch-translate.ts --weekly

      - name: Commit weekly Top 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/ processed_articles.json .runlog.jsonl
          if git diff --quiet --cached; then
            echo "No new articles to commit."
            exit 0
          fi
          git commit -m "ci: weekly Top 5 [skip ci]"
          git push

      - name: Build Next.js
        run: npm run build