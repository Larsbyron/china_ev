name: Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,10,18 * * *'  # 04:00, 10:00, 18:00 UTC
    # 注意：DeepSeek 的贵时段(peak) = 周一~五 UTC 01:00-04:00 与 06:00-10:00。
    # 原 02:00 落在 peak 里，token 按双倍价计费 → 挪到 04:00（04:00-06:00 是空档，留足余量）。
    # 10:00 是 peak 结束的那一刻、18:00 本来就在空闲时段。周末与国内法定节假日全天都算空闲时段。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx tsx scripts/fetch-translate.ts

      - name: Commit fingerprints and new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/ public/images/ processed_articles.json .runlog.jsonl
          if git diff --quiet --cached; then
            echo "No new articles to commit."
            exit 0
          fi
          git commit -m "ci: daily update [skip ci]"
          git pull --rebase origin main
          git push

      - name: Build Next.js
        run: npm run build
