name: Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,13,17 * * *'  # 09:00, 13:00, 17:00 UTC
    # 为什么不是 02:00/10:00/18:00：GitHub Actions 的 schedule 不按点跑！实测 40 次运行，
    # 实际启动比预定晚 109~366 分钟（中位 +4 小时）。原 02:00 因此总在 07:00 左右启动 ——
    # 正好落进 DeepSeek 的贵时段（周一~五 UTC 01:00-04:00 与 06:00-10:00）。
    # 安全的做法：把 cron 放在 08:12~17:54 UTC 之间，这样即使延迟 1.8~6.1 小时，
    # 启动时刻也一定落在 10:00-24:00 这个 14 小时的空闲大窗口内（周末/国内法定节假日全天更便宜）。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 思考档位降级（2026-09-23 灰度 → 2026-10-08 转正）：
          # 实测 899 次调用（降档）vs 256 次（未降档）：输出 5435→2765 tok/次(-49%)、
          # 8192 截断 20%→3%、成本 ¥0.024→¥0.013/次(-46%)，发布量无下滑。
          # 2026-10-07 的自动过期阀到期时复核过，结论=保留，因此去掉 UNTIL 长期生效。
          # 回滚：删这一行（或设 high）。
          TRANSLATION_REASONING_EFFORT: low
        run: npx tsx scripts/fetch-translate.ts

      - name: Commit fingerprints and new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/ public/images/ processed_articles.json .runlog.jsonl
          if git diff --quiet --cached; then
            echo "No new articles to commit."
            exit 0
          fi
          git commit -m "ci: daily update [skip ci]"
          git pull --rebase origin main
          git push

      - name: Build Next.js
        run: npm run build

      # 把新文章即时通知 Bing 系索引（Bing/DuckDuckGo/Ecosia/Yahoo 共用 Bing 索引）。
      # 实测 30 天被推荐访客里的 43% 来自 Bing 系、Google 仅 1.5%，所以先把 Bing 收录做快。
      # 只提交最新 60 条（IndexNow 礼仪：只推新增/变更 URL），失败不阻断流水线。
      - name: Notify IndexNow
        if: always()
        continue-on-error: true
        run: npx tsx scripts/indexnow.ts --limit 60
