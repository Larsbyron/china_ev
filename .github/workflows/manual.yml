name: Manual Pipeline Dispatch

on:
  workflow_dispatch:  # Manual trigger for testing

jobs:
  manual-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install gray-matter
        run: npm install gray-matter

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/fetch-translate.ts

      - name: Build Next.js
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Commit fingerprints and new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/ processed_articles.json .runlog.jsonl
          git diff --quiet --cached || exit 0
          git commit -m "ci: manual pipeline run [skip ci]"
          git push
